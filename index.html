<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover useful independent software, or share what you made and get honest feedback before you sell." />
    <title>CreatorWorks — Useful software, made by real people.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="brand" type="button" data-route="discover" aria-label="CreatorWorks catalog">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Creator<span class="brand-name-works">Works</span></span>
        <span class="brand-promise">Useful software, made by real people.</span>
      </button>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
      <nav class="site-nav" aria-label="Main navigation">
        <button data-route="discover">Browse tools</button>
        <button class="nav-share" data-route="share">List your project</button>
        <button class="profile-button" data-route="account" aria-label="My CreatorWorks">C</button>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <button class="footer-brand" data-route="discover"><span>Creator<span class="brand-name-works">Works</span></span></button>
      <p>Useful software, made by real people.</p>
      <div><button data-route="discover">Discover</button><button data-route="share">List your project</button></div>
    </footer>

    <script src="preview-utils.js"></script>
    <script src="/project-media.js"></script><script src="/account-nav.js"></script>
  <script src="app.js"></script>
  <script src="/analytics.js" defer></script></body>
</html>
